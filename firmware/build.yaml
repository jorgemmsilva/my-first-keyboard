include:
  - board: nice_nano@2.0.0//zmk
    # shield: my_keyboard_left nice_view_gem
    shield: my_keyboard_left nice_view
    snippet: studio-rpc-usb-uart # enables RPC over usb for zmk studio
    artifact-name: my_keyboard_left

  - board: nice_nano@2.0.0//zmk
    # shield: my_keyboard_right nice_view_gem
    shield: my_keyboard_right nice_view 
    artifact-name: my_keyboard_right

  # logging firmware for testing
  - board: nice_nano@2.0.0//zmk
    shield: my_keyboard_left nice_view
    snippet: studio-rpc-usb-uart zmk-usb-logging
    artifact-name: my_keyboard_left_logging

  - board: nice_nano@2.0.0//zmk
    shield: my_keyboard_right nice_view 
    snippet: zmk-usb-logging
    artifact-name: my_keyboard_right_logging

  # reset firmware
  - board: nice_nano@2.0.0//zmk
    shield: settings_reset
    artifact-name: my_keyboard_settings_reset



